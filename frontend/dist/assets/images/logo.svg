<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff477e"/>
      <stop offset="100%" stop-color="#ff70a6"/>
    </linearGradient>
    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9770"/>
      <stop offset="100%" stop-color="#ffd670"/>
    </linearGradient>
  </defs>
  
  <!-- Icon: Sweet pastry cake & sparkle -->
  <g transform="translate(10, 12)">
    <rect x="0" y="24" width="52" height="28" rx="8" fill="url(#logoGrad)"/>
    <!-- Frosting drip -->
    <path d="M0 32 Q 6 42, 13 32 Q 20 42, 26 32 Q 33 42, 39 32 Q 46 42, 52 32 L 52 24 L 0 24 Z" fill="#ffffff" opacity="0.9"/>
    <!-- Berry topping -->
    <circle cx="26" cy="18" r="9" fill="#d90429"/>
    <circle cx="23" cy="15" r="3" fill="#ffffff" opacity="0.7"/>
    <!-- Little Sparkle -->
    <path d="M 44 8 Q 48 14, 54 14 Q 48 14, 44 20 Q 44 14, 38 14 Q 44 14, 44 8 Z" fill="url(#subGrad)"/>
  </g>

  <!-- Typography -->
  <text x="76" y="44" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-size="28" font-weight="900" fill="#2b1810" letter-spacing="-0.5">
    Dulce<tspan fill="#ff477e">Vicio</tspan>
  </text>
  <text x="78" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" fill="#a46843" letter-spacing="2">
    PASTELERÍA ARTESANAL
  </text>
</svg>
